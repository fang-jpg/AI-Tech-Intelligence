[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tech-intelligence"
version = "0.1.0"
description = "Evidence-grounded executive intelligence pipeline for frontier AI vendors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-tech-intel = "ai_tech_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

