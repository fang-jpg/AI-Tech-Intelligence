# YouTube 默认关闭。填入官方频道 channel_id 并设置 enabled: true 后，collector 会获取视频标题、日期和描述。
# YouTube Data API 不提供视频转写；需要全文分析时应另接字幕/ASR，并保持 speaker attribution 校验。
youtube:
  enabled: false
  max_results_per_channel: 10
  channels: []
